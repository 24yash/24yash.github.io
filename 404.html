<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · Yash Singhal</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">
<style>
  .nf { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .nf-card { width: min(560px, 100%); padding: 0; overflow: hidden; }
  .nf-top { padding: 28px 26px 20px; }
  .nf-code { font-size: clamp(72px, 16vw, 120px); line-height: .9; letter-spacing: -0.05em; font-weight: 600; margin: 0; }
  .nf-code .serif { font-style: italic; font-weight: 400; color: var(--a2); }
  .nf-top p { color: var(--muted); margin: 12px 0 0; font-size: 16px; }
  .nf-log { border-top: 1px solid var(--line); background: var(--bg-2); padding: 14px 26px; font-size: 12.5px; color: var(--muted); display: grid; gap: 4px; }
  .nf-log b { color: var(--a3); font-weight: 500; }
  .nf-log .bad { color: var(--a2); }
  .nf-foot { border-top: 1px solid var(--line); padding: 16px 26px; display: flex; gap: 10px; flex-wrap: wrap; }
</style>
</head>
<body>
<main class="nf">
  <div class="card nf-card">
    <div class="nf-top">
      <p class="eyebrow mono">GET <span id="path">/this-page</span></p>
      <h1 class="nf-code">4<span class="serif">0</span>4</h1>
      <p>Nothing is deployed at this route. The reconciler looked everywhere and found no matching resource.</p>
    </div>
    <div class="nf-log mono" aria-hidden="true">
      <span>→ lookup route ........ <span class="bad">not found</span></span>
      <span>→ retry (idempotent) .. <span class="bad">still not found</span></span>
      <span>→ fallback ............ <b>redirecting you home ✓</b></span>
    </div>
    <div class="nf-foot">
      <a class="btn primary" href="/">Take me home</a>
      <a class="btn" href="/#tldr">30-second version</a>
      <a class="btn" href="mailto:yash2492003@gmail.com?subject=Broken%20link%20on%20your%20site">Report it</a>
    </div>
  </div>
</main>
<script>document.getElementById('path').textContent = location.pathname;</script>
</body>
</html>
