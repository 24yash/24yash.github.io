name: Refresh LeetCode stats

on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull stats
        run: python3 scripts/update_leetcode.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/leetcode.json; then echo "nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leetcode.json
          git commit -m "Refresh LeetCode stats"
          git push
